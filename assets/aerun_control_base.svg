<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500">
<!--
  AERUN — ELEVATION CONTROL BASE (for image-generation reference / img2img)
  READ THE ALTITUDE STACK:
    teal  = ocean, sea level
    green = coastal lowland ring, 0-200 ft  (ALL cities and landmarks live here)
    ochre = the Rim Wall cliff band, a 2000 ft CLIMB
    pale gray = THE PLATEAU TOP (Sea of Silt), +1800 ft — the HIGHEST large surface
  The gray is ON TOP of the cliffs. It is not water, not a crater, not a lowland.
-->

  <!-- 1. OCEAN -->
  <rect width="2000" height="1500" fill="#14586e"/>

  <!-- 2. GREEN COASTAL RING (low) — irregular island: NW lobe, west notch,
       east coast pushed outward by the Prong, rounded south -->
  <path fill="#7f9150" stroke="#5d6f36" stroke-width="5" d="
    M 700,120 C 850,86 1010,88 1140,126 C 1260,162 1356,214 1424,286
    C 1520,318 1606,376 1660,458 C 1742,584 1744,720 1690,838
    C 1642,942 1554,1016 1448,1058 C 1350,1188 1206,1288 1036,1338
    C 862,1388 686,1368 542,1290 C 396,1210 292,1072 250,914
    C 216,786 224,660 268,548 C 214,506 190,446 202,388
    C 218,306 292,250 380,244 C 452,182 570,140 700,120 Z"/>

  <!-- 3. RIM WALL cliff band (solid ochre = the 2000 ft climb) -->
  <path fill="#a9763f" stroke="#63401b" stroke-width="4" d="
    M 726,296 C 872,262 1024,268 1146,312 C 1250,350 1330,410 1376,482
    C 1470,506 1548,566 1590,652 C 1642,760 1628,872 1560,956
    C 1508,1020 1432,1060 1346,1072 C 1264,1148 1160,1200 1044,1222
    C 900,1250 760,1224 650,1156 C 528,1080 452,958 438,824
    C 426,706 462,592 540,506 C 592,448 656,352 726,296 Z"/>

  <!-- 4. PLATEAU TOP = SEA OF SILT (+1800 ft, HIGHEST) with THE PRONG lobe SE -->
  <path fill="#dedac f" fill-opacity="0" d=""/>
  <path fill="#dcd8cd" stroke="#c6c1b5" stroke-width="4" d="
    M 748,352 C 886,320 1024,326 1132,366 C 1224,400 1292,452 1330,516
    C 1420,538 1490,590 1524,664 C 1560,742 1548,824 1494,884
    C 1452,930 1392,956 1324,962
    C 1256,1030 1166,1078 1064,1098 C 934,1124 800,1100 700,1038
    C 588,970 522,858 512,736 C 504,634 538,538 606,466
    C 650,420 698,378 748,352 Z"/>

  <!-- wind-spiral guides on the silt -->
  <g fill="none" stroke="#cec9bd" stroke-width="4" opacity="0.8">
    <ellipse cx="880" cy="520" rx="96" ry="54" transform="rotate(-16 880 520)"/>
    <ellipse cx="1080" cy="720" rx="128" ry="68" transform="rotate(14 1080 720)"/>
    <ellipse cx="760" cy="830" rx="88" ry="48" transform="rotate(-32 760 830)"/>
  </g>

  <!-- 5. SPILL-RAMPS: gray tongues descending through rim gaps -->
  <path fill="#d4cfc4" stroke="#bab5a9" stroke-width="3" d="
    M 1320,520 C 1382,516 1436,540 1462,578 C 1484,612 1474,644 1436,654
    C 1390,666 1340,644 1318,602 C 1302,572 1304,540 1320,520 Z"/>
  <path fill="#d4cfc4" stroke="#bab5a9" stroke-width="3" d="
    M 946,1074 C 986,1110 1000,1160 986,1200 C 970,1240 930,1256 898,1236
    C 864,1214 856,1164 872,1122 C 886,1088 916,1068 946,1074 Z"/>
  <!-- silt-falls at low notches -->
  <g fill="#cec9bd" opacity="0.95">
    <path d="M 624,412 l 28,10 -16,50 -24,-12 z"/>
    <path d="M 1500,742 l 28,-6 14,52 -28,8 z"/>
    <path d="M 690,1010 l 26,14 -20,44 -24,-16 z"/>
  </g>

  <!-- 6. MOUNTAINS — taller than the plateau (NW-SW arc + Badlands + Mekillots) -->
  <g fill="#8b7250" stroke="#5a4529" stroke-width="2">
    <path d="M 486,306 l 36,-62 36,62 z"/><path d="M 434,368 l 38,-66 38,66 z"/>
    <path d="M 392,444 l 36,-62 36,62 z"/><path d="M 368,528 l 38,-66 38,66 z"/>
    <path d="M 362,618 l 36,-62 36,62 z"/><path d="M 380,704 l 38,-66 38,66 z"/>
    <path d="M 414,790 l 36,-62 36,62 z"/><path d="M 466,868 l 38,-66 38,66 z"/>
    <path d="M 1618,700 l 32,-54 32,54 z"/><path d="M 1650,776 l 32,-54 32,54 z"/>
    <path d="M 1626,850 l 32,-54 32,54 z"/><path d="M 1578,916 l 32,-54 32,54 z"/>
    <path d="M 700,1268 l 32,-52 32,52 z"/><path d="M 748,1286 l 28,-46 28,46 z"/>
  </g>
  <!-- volcano: Mountain of the Black Crown (beside Urik) -->
  <path d="M 396,952 l 50,-84 50,84 z" fill="#4b4139" stroke="#2b231c" stroke-width="3"/>
  <circle cx="446" cy="876" r="10" fill="#e6e0d6" opacity="0.9"/>

  <!-- 7. CRESCENT FOREST — bowed arc in the GREEN band, wrapping the Prong's cliffs -->
  <path fill="#3f6b32" stroke="#25451d" stroke-width="4" d="
    M 1470,466 C 1566,548 1616,668 1608,790 C 1600,916 1530,1024 1410,1090
    C 1350,1122 1286,1140 1230,1144 C 1300,1096 1366,1036 1414,964
    C 1470,880 1500,780 1500,676 C 1500,600 1486,528 1470,466 Z"/>

  <!-- 8. RING ROAD -->
  <path fill="none" stroke="#dfa94e" stroke-width="10" stroke-linecap="round" d="
    M 760,196 C 900,164 1046,168 1166,208 C 1276,246 1362,304 1418,376
    C 1516,414 1600,478 1650,568 C 1712,684 1706,806 1646,910
    C 1596,996 1512,1056 1414,1090 C 1330,1188 1204,1258 1058,1300
    C 900,1346 736,1322 606,1246 C 470,1166 376,1038 344,896
    C 316,776 330,660 380,560 C 326,522 302,466 314,414
    C 330,344 396,300 470,296 C 540,236 630,208 760,196"/>

  <!-- 9. SILT SHIPPING LANE: Raam ramp -> Balic ramp, E and S reaches only -->
  <path fill="none" stroke="#8e8880" stroke-width="6" stroke-dasharray="22 20" stroke-linecap="round" d="
    M 1378,586 C 1352,700 1296,806 1206,890 C 1120,970 1030,1010 962,1108"/>
  <g fill="#7a746b">
    <circle cx="1356" cy="660" r="8"/><circle cx="1306" cy="762" r="8"/>
    <circle cx="1228" cy="856" r="8"/><circle cx="1128" cy="928" r="8"/>
    <circle cx="1040" cy="990" r="8"/><circle cx="986" cy="1060" r="8"/>
  </g>

  <!-- 10. LOWLAND LANDMARKS — ALL between the cliff band and the coast -->
  <!-- Dragon's Bowl: irregular ELONGATED basin ~30 mi N of Urik, in the green -->
  <path fill="#6d7f44" stroke="#3a4e1e" stroke-width="5" d="
    M 318,742 C 356,712 400,714 424,748 C 448,782 444,830 416,864
    C 386,900 340,906 310,880 C 280,854 274,806 292,772 C 299,758 308,748 318,742 Z"/>
  <ellipse cx="352" cy="768" rx="30" ry="20" fill="#2f7fa8" stroke="#1c5878" stroke-width="3"/>
  <path d="M 356,884 l 24,26 -32,10 z" fill="#7f9150" stroke="#3a4e1e" stroke-width="2"/>
  <!-- Yaramuke ruins WITH Black Oasis inside — one site, in the green, Urik->Raam road -->
  <g>
    <rect x="726" y="176" width="64" height="48" fill="#9c9179" stroke="#5a5142" stroke-width="4"/>
    <ellipse cx="758" cy="200" rx="16" ry="11" fill="#191920" stroke="#000" stroke-width="2"/>
  </g>
  <!-- Bitter Well -->
  <circle cx="300" cy="486" r="11" fill="#2f7fa8" stroke="#1c5878" stroke-width="3"/>
  <!-- Walis spire -->
  <path d="M 470,238 l 18,-32 18,32 z" fill="#9c9179" stroke="#5a5142" stroke-width="2"/>
  <!-- Altaruk fort (southern Ring Road) -->
  <rect x="1040" y="1300" width="28" height="28" fill="#9c9179" stroke="#5a5142" stroke-width="4"/>
  <!-- Salt View (Mekillot east face) -->
  <rect x="782" y="1266" width="24" height="24" fill="#9c9179" stroke="#5a5142" stroke-width="4"/>
  <!-- Ogo (under forest canopy) -->
  <rect x="1372" y="1046" width="26" height="26" fill="#9c9179" stroke="#5a5142" stroke-width="4"/>

  <!-- 11. CITIES (dots at 500-mile scale) -->
  <g stroke="#241d18" stroke-width="4" fill="#f2e9d5">
    <circle cx="880" cy="176" r="16"/>    <!-- DRAJ -->
    <circle cx="1188" cy="228" r="12"/>   <!-- BLACKGUARD -->
    <circle cx="1428" cy="430" r="19"/>   <!-- RAAM -->
    <circle cx="1560" cy="640" r="16"/>   <!-- NIBENAY -->
    <circle cx="1444" cy="1000" r="16"/>  <!-- GULG -->
    <circle cx="1152" cy="1256" r="12"/>  <!-- AMBER VALLEY -->
    <circle cx="930" cy="1320" r="17"/>   <!-- BALIC -->
    <circle cx="404" cy="1010" r="17"/>   <!-- URIK -->
    <circle cx="226" cy="596" r="12"/>    <!-- HOLLOWSTORM -->
    <circle cx="300" cy="352" r="12"/>    <!-- OSGAKER -->
    <circle cx="556" cy="196" r="16"/>    <!-- TYR -->
    <circle cx="672" cy="374" r="12"/>    <!-- ELDORADO (rim pass) -->
  </g>

  <!-- 12. LABELS -->
  <g font-family="Georgia, serif" fill="#241d18">
    <text x="980" y="700" font-size="52" fill="#6e675b" letter-spacing="10" text-anchor="middle">THE SEA OF SILT</text>
    <text x="980" y="748" font-size="23" fill="#8b8478" letter-spacing="3" text-anchor="middle">plateau top — the HIGHEST surface, +1800 ft</text>
    <text x="790" y="600" font-size="21" fill="#8b8478" text-anchor="middle">THE BLANK — leave empty</text>
    <text x="1390" y="700" font-size="26" fill="#5a5348" transform="rotate(64 1390 700)">THE PRONG</text>
    <text x="700" y="330" font-size="21" fill="#3d2b12" transform="rotate(-20 700 330)">THE RIM WALL (2000 ft climb)</text>
    <text x="1520" y="880" font-size="21" fill="#e6dcc6" transform="rotate(-68 1520 880)">CRESCENT FOREST</text>
    <text x="1010" y="1390" font-size="22">THE RING ROAD</text>
    <text x="1200" y="880" font-size="18" fill="#57503f" transform="rotate(44 1200 880)">SILT LANE</text>
    <text x="1466" y="580" font-size="16" fill="#4a4438" transform="rotate(40 1466 580)">Raam ramp</text>
    <text x="944" y="1180" font-size="16" fill="#4a4438">Balic ramp</text>

    <g font-size="23" text-anchor="middle">
      <text x="880" y="152">DRAJ</text><text x="1188" y="206">Blackguard</text>
      <text x="1428" y="404">RAAM</text><text x="1600" y="636">NIBENAY</text>
      <text x="1486" y="996">GULG</text><text x="1152" y="1290">Amber Valley</text>
      <text x="930" y="1358">BALIC</text><text x="404" y="1050">URIK</text>
      <text x="226" y="628">Hollowstorm</text><text x="300" y="330">Osgaker</text>
      <text x="556" y="172">TYR</text><text x="716" y="378">Eldorado</text>
    </g>
    <g font-size="18" fill="#2d2820" text-anchor="middle">
      <text x="356" y="704">Dragon's Bowl</text><text x="352" y="812">Lake Pit</text>
      <text x="758" y="160">Yaramuke + Black Oasis</text>
      <text x="300" y="464">Bitter Well</text><text x="488" y="196">Walis</text>
      <text x="1054" y="1348">Altaruk</text><text x="806" y="1252">Salt View</text>
      <text x="1385" y="1096">Ogo</text>
      <text x="446" y="856">Black Crown</text>
      <text x="1690" y="800" transform="rotate(90 1690 800)">BADLANDS</text>
      <text x="360" y="640" transform="rotate(-74 360 640)">RINGING MTNS</text>
      <text x="690" y="1330" transform="rotate(-18 690 1330)">MEKILLOT MTNS</text>
    </g>
  </g>

  <!-- 13. SCALE + LEGEND -->
  <g transform="translate(1600,1400)">
    <rect x="0" y="0" width="120" height="15" fill="#f2e9d5" stroke="#241d18" stroke-width="2"/>
    <rect x="120" y="0" width="120" height="15" fill="#241d18" stroke="#241d18" stroke-width="2"/>
    <text x="0" y="-9" font-family="Georgia,serif" font-size="19" fill="#f2e9d5">0</text>
    <text x="110" y="-9" font-family="Georgia,serif" font-size="19" fill="#f2e9d5">100</text>
    <text x="222" y="-9" font-family="Georgia,serif" font-size="19" fill="#f2e9d5">200 mi</text>
  </g>
  <text x="40" y="1436" font-family="Georgia,serif" font-size="22" fill="#d6e6ee">AERUN — elevation control base</text>
  <text x="40" y="1468" font-family="Georgia,serif" font-size="19" fill="#a9c4d0">ocean (teal, 0 ft) → coastal lowland ring (green, 0–200 ft) → RIM WALL cliffs (ochre, +2000 ft climb) → PLATEAU TOP / Sea of Silt (pale gray, +1800 ft, HIGHEST). All cities &amp; landmarks are in the green.</text>
</svg>
